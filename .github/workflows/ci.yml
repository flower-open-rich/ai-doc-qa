# GitHub Actions CI: 每次 push / PR 自动跑 lint + 类型检查 + 测试
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 只装测试/lint 需要的部分，不装 torch（省 CI 时间和体积）。
          # 测试全部用 stub 替身，不会真的加载 Embedding 模型。
          pip install ruff mypy pytest pytest-asyncio pytest-cov
          pip install -r requirements.txt

      - name: ✨ Ruff (lint)
        run: ruff check .

      - name: 🎨 Ruff (format check)
        run: ruff format --check .

      - name: 🔍 Mypy (type check)
        # 之前这里写了 `|| true`，等于类型检查永远不报错、CI 永远是绿的，
        # 那就失去了 CI 的意义。现在改成真的会失败。
        # app/ 现有代码全部通过，新增代码请自行修好类型问题。
        run: mypy app/

      - name: 🧪 Run tests
        # 测试用 stub 替身，不需要真实 API Key / 余额，所以在 CI 里能真跑。
        run: pytest tests/ -v --cov=app --cov-report=term-missing
