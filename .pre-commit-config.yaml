# Pre-commit hooks: git commit 时自动检查代码质量
# 安装：pip install pre-commit && pre-commit install
# 之后每次 commit 会自动运行这些检查
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace   # 删除行尾空格
      - id: end-of-file-fixer     # 文件末尾加空行
      - id: check-yaml            # YAML 语法检查
      - id: check-toml            # TOML 语法检查
      - id: check-added-large-files
        args: ['--maxkb=500']     # 防止提交大于 500KB 的文件
      - id: check-merge-conflict
      - id: detect-private-key    # 防止误提交私钥
      - id: check-case-conflict   # 防止仅大小写不同的重名文件
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']  # 禁止直接提交到主干

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ['--fix']          # 自动修复可修的问题
      - id: ruff-format          # 代码格式化
